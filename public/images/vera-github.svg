<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Vera</title>
  <desc id="desc">An open circle on a warm paper background.</desc>
  <rect width="1200" height="280" fill="#f8f5ed"/>
  <!-- The homepage's 14-degree opening, centered on the upper-right diagonal. -->
  <circle cx="600" cy="140" r="80" pathLength="360" fill="none" stroke="#292c25"
    stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="346 14" transform="rotate(-38 600 140)"/>
</svg>
