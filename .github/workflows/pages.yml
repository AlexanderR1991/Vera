name: Build and publish multilingual Astro site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # PR validation should not wait for a potentially slow Pages deployment on main.
  group: astro-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The observatory reconstructs snapshots from Git history.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research pipeline (offline)
        run: |
          python -m py_compile scripts/wahrheitsschwarm.py scripts/angriffsschwarm.py
          python -m unittest discover -s tests -p 'test_*.py'
          python -m json.tool public/research/stream.json > /dev/null
          python -m json.tool public/research/angriffe.json > /dev/null
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and validate
        run: |
          npm run build
          python scripts/validate_site.py
          python scripts/check_vera_entry.py --revision "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  public-entry:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the published path to an objection
        run: |
          for delay in 0 5 15 30; do
            sleep "$delay"
            if python3 scripts/check_vera_entry.py --live --revision "$GITHUB_SHA"; then
              exit 0
            fi
          done
          exit 1
