name: "Quelle prüfen / Examine evidence"
description: "Faktische Aussage, Beleg oder Gegenbeleg prüfen / Review a factual claim or source"
title: "[Quelle / Evidence] "
body:
  - type: markdown
    attributes:
      value: |
        Bitte zwischen empirischer Behauptung, philosophischer These und Metapher unterscheiden.
        Distinguish empirical claims from philosophical positions and metaphors.
        Quellen aus dem ganzen öffentlichen Netz sind willkommen; eine Fundstelle ist noch kein Beleg.
        Sources from across the public web are welcome; a reference is not yet evidence.
        Kunst und Deutungen können auch über die Vorlage Kunst & Gegenlesart eingebracht werden.
        Art and interpretations can also use the Art & alternative reading form.
  - type: textarea
    id: aussage
    attributes:
      label: "Zu prüfende Aussage / Claim to examine"
      description: "Möglichst genaue Stelle oder Formulierung / Quote the precise claim"
    validations:
      required: true
  - type: input
    id: stelle
    attributes:
      label: "Link oder Kapitel / Link or chapter"
  - type: textarea
    id: belege
    attributes:
      label: "Quellen und Daten / Sources and data"
      description: "Original-Link, Urheberschaft, Datum/Version, genaue Seite/Zeitmarke; kenntlich machen, ob Volltext oder nur Metadaten gelesen. Original link, creator, date/version, exact page/time; state whether full text or metadata only was read."
    validations:
      required: true
  - type: textarea
    id: kritik
    attributes:
      label: "Was stützt oder widerlegt die Aussage? / Supporting or conflicting evidence"
    validations:
      required: true
  - type: textarea
    id: herkunft
    attributes:
      label: "Quellenart und Abhängigkeiten / Source type and dependencies (optional)"
      description: "Studie, Preprint, Essay, Kunstwerk, Erfahrungsbericht? Kopie, Übersetzung oder andere Fassung derselben Quelle? Study, preprint, essay, artwork, experience? Copy, translation or version of another source?"
  - type: textarea
    id: korrektur
    attributes:
      label: "Mögliche Korrektur / Proposed correction (optional)"
